name: Task
description: One unit of work, small enough for one branch and one PR.
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What to do
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Testable. If this needs more than one PR, make it a Feature instead.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant decisions, specs, or files. Set the parent Feature as this issue's parent.
